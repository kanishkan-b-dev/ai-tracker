<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - My Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background-color: #f7f4ee !important; 
            color: #18181b; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        body :not(i) {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
        }

        /* Sandal White macOS Window with Crisp Black Border */
        .glass-window { 
            background: #ffffff !important; 
            border: 2px solid #000000 !important; 
            border-radius: 1rem; 
            box-shadow: 4px 4px 0px #000000 !important;
            transition: all 0.2s ease;
            overflow: hidden;
            width: 100%;
            max-width: 440px;
        }

        .window-header {
            padding: 1rem 1.25rem 0.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1.5px solid #000000;
            background: #f7f4ee;
        }

        /* Monochrome Black Border Window Dots */
        .mac-traffic-dots {
            display: flex;
            align-items: center;
            gap: 7px;
        }
        .mac-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            background: #ffffff;
            border: 1.5px solid #000000;
        }

        /* High-Contrast Black Primary Button */
        .btn-primary { 
            background: #000000 !important; 
            color: #ffffff !important; 
            padding: 0.75rem 1.25rem; 
            border-radius: 0.65rem; 
            font-size: 0.925rem; 
            font-weight: 600; 
            border: 1.5px solid #000000 !important; 
            cursor: pointer; 
            display: inline-flex; 
            align-items: center; 
            justify-content: center;
            gap: 0.5rem; 
            width: 100%;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.4) !important;
            transition: all 0.15s ease !important; 
        }
        .btn-primary:hover { 
            background: #27272a !important; 
            color: #ffffff !important;
            box-shadow: 3px 3px 0px #000000 !important;
            transform: translateY(-1px);
        }
        .btn-primary:active {
            transform: translateY(1px);
            box-shadow: 1px 1px 0px #000000 !important;
        }

        /* Inputs: Sandal White with Crisp Black Border */
        .input { 
            width: 100%; 
            padding: 0.75rem 1rem; 
            background: #ffffff !important; 
            border: 1.5px solid #000000 !important; 
            border-radius: 0.65rem; 
            color: #000000 !important; 
            font-size: 0.9rem; 
            box-shadow: 1px 1px 0px rgba(0,0,0,0.15);
            transition: all 0.15s ease; 
        }
        .input::placeholder { color: #71717a; }
        .input:focus { 
            outline: none; 
            border-color: #000000 !important; 
            box-shadow: 3px 3px 0px #000000 !important;
        }

        .badge { 
            display: inline-flex; 
            align-items: center; 
            padding: 0.35rem 0.75rem; 
            border-radius: 9999px; 
            font-size: 0.75rem; 
            font-weight: 600; 
            background: #f4efe6 !important; 
            color: #000000 !important; 
            border: 1.5px solid #000000 !important; 
            box-shadow: 1px 1px 0px #000000;
            transition: all 0.15s ease;
        }
        .badge:hover {
            background: #ede8dc !important;
            border-color: #000000 !important;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 1.25s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body>

    <div class="glass-window fade-in">
        <!-- macOS Window Titlebar -->
        <div class="window-header">
            <div class="mac-traffic-dots">
                <span class="mac-dot"></span>
                <span class="mac-dot"></span>
                <span class="mac-dot"></span>
            </div>
            <span class="text-xs text-black font-mono tracking-wider font-semibold">• My Tracker</span>
        </div>

        <div class="p-8 pt-6 bg-white">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-[#f4efe6] border-2 border-black shadow-[2px_2px_0px_#000000] mb-4">
                    <i class="fas fa-brain text-2xl text-black"></i>
                </div>
                <h1 class="text-2xl font-bold text-black mb-1 tracking-tight">My Tracker</h1>
                <p class="text-sm text-gray-600">Track your daily learning & job applications</p>
            </div>

            {% if messages %}
                <div class="mb-5 space-y-2">
                    {% for message in messages %}
                        <div class="p-3.5 rounded-xl text-sm bg-red-50 text-red-800 border-2 border-red-600 shadow-[2px_2px_0px_rgba(220,38,38,0.4)]">
                            {{ message }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <form method="post" class="space-y-5">
                {% csrf_token %}
                <div>
                    <label for="username" class="block text-xs font-bold text-black uppercase tracking-wider mb-2">
                        <i class="fas fa-user text-black mr-1.5"></i>
                        Username
                    </label>
                    <input type="text" 
                           name="username" 
                           id="username" 
                           required
                           autocomplete="username"
                           class="input"
                           placeholder="Enter your username">
                </div>

                <div>
                    <label for="password" class="block text-xs font-bold text-black uppercase tracking-wider mb-2">
                        <i class="fas fa-lock text-black mr-1.5"></i>
                        Password
                    </label>
                    <div class="relative">
                        <input type="password" 
                                name="password" 
                                id="password" 
                                required
                                autocomplete="current-password"
                                class="input pr-10"
                                placeholder="Enter your password">
                        <button type="button" 
                                id="togglePassword" 
                                class="absolute right-3.5 top-1/2 -translate-y-1/2 text-gray-600 hover:text-black focus:outline-none transition-colors">
                            <i class="far fa-eye" id="eyeIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary mt-2">
                    <span>Sign In</span>
                    <i class="fas fa-arrow-right text-xs"></i>
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-black/15">
                <div class="text-center text-xs text-gray-600">
                    <p class="mb-2 font-semibold text-black">Demo Account:</p>
                    <div class="flex justify-center">
                        <button type="button" class="badge cursor-pointer" onclick="document.getElementById('username').value='demo'; document.getElementById('password').value='demo1234';">
                            <i class="fas fa-key mr-1.5 text-xs text-black"></i> demo / demo1234 (Click to autofill)
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (togglePassword && passwordInput && eyeIcon) {
            togglePassword.addEventListener('click', function() {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                if (type === 'password') {
                    eyeIcon.classList.remove('fa-eye-slash');
                    eyeIcon.classList.add('fa-eye');
                } else {
                    eyeIcon.classList.remove('fa-eye');
                    eyeIcon.classList.add('fa-eye-slash');
                }
            });
        }
    </script>
</body>
</html>
